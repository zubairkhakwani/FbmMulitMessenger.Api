<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBM Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 300px;
            min-height: 200px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* ── Header ── */
        .header {
            background: #1877f2;
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

            .header h1 {
                font-size: 15px;
                font-weight: 600;
            }

        /* ── Status dot ── */
        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

            .dot.green {
                background: #42c96b;
                box-shadow: 0 0 4px #42c96b;
            }

            .dot.red {
                background: #ff4d4d;
                box-shadow: 0 0 4px #ff4d4d;
            }

        /* ── Body ── */
        .body {
            padding: 20px 16px;
        }

        /* ── Login form ── */
        #loginView .field {
            margin-bottom: 12px;
        }

        #loginView label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }

        #loginView input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }

            #loginView input:focus {
                border-color: #1877f2;
            }

        .btn {
            width: 100%;
            padding: 9px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn:hover {
                background: #1565d8;
            }

            .btn:disabled {
                background: #aaa;
                cursor: not-allowed;
            }

        .error-msg {
            color: #e53935;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            min-height: 16px;
        }

        /* ── Connected view ── */
        #connectedView {
            text-align: center;
        }

        #connectedView .field {
            margin-bottom: 12px;
            text-align: left;
        }

        #connectedView label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }

        #connectedView input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }

            #connectedView input:focus {
                border-color: #1877f2;
            }

        #connectedView .btn {
            margin-top: 14px;
        }

        .api-key-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .api-key-row input {
                flex: 1;
                min-width: 0;
            }

        .icon-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .icon-btn:hover {
                background: #f0f0f0;
                border-color: #1877f2;
            }

            #connectedView .account-info {
                background: white;
                border-radius: 8px;
                padding: 14px;
                margin-bottom: 14px;
                border: 1px solid #eee;
                font-size: 13px;
            }

                #connectedView .account-info span {
                    display: block;
                    color: #888;
                    font-size: 11px;
                    margin-top: 2px;
                }

        .btn-logout {
            width: 100%;
            padding: 9px;
            background: white;
            color: #e53935;
            border: 1px solid #e53935;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 14px;
        }

            .btn-logout:hover {
                background: #e53935;
                color: white;
            }

        /* ── Loading ── */
        #loadingView {
            text-align: center;
            padding: 30px 0;
            color: #888;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FBM Messenger</h1>
        <div class="status-row">
            <div class="dot red" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="body">

        <!-- Loading -->
        <div id="loadingView">Checking status...</div>

        <!-- Login Form -->
        <div id="loginView" class="hidden">
            <div class="field">
                <label>Username or Email</label>
                <input type="text" id="username" placeholder="Enter username" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" />
            </div>
            <button class="btn" id="loginBtn">Login</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- Connected / Logged in View -->
        <div id="connectedView" class="hidden">
            <div class="account-info">
                <strong id="accountIdLabel">—</strong>
                <span>Account ID</span>
                <div class="error-msg" id="registrationErrorMsg"></div>
            </div>
            <div class="field">
                <label>API Key</label>
                <div class="api-key-row">
                    <input type="password" id="apiKeyInput" placeholder="Enter Multi Messenger API key" autocomplete="off" spellcheck="false" />
                    <button type="button" class="icon-btn" id="toggleApiKeyBtn" title="Show API key">👁</button>
                </div>
            </div>
            <button class="btn" style="margin-bottom:0.5rem;" id="saveApiKeyBtn">Save API Key</button>
            <button class="btn-logout" id="logoutBtn">Logout</button>
            <div class="error-msg" id="apiKeyErrorMsg"></div>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
